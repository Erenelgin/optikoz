<!DOCTYPE html>
<html lang='tr'>
 <head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta charset='UTF-8'>
  <style>
   *{
     margin:0;
     padding:0;
     box-sizing:border-box;
    }

    body{
     background-color:#EEEEEF;
     padding-top:80px;
    }

   .navbar{
      position:fixed;
      width:100%;
      z-index:1000;
      top:0;
      background-color:#1A1A1A;
      display:flex;
      justify-content:center;
      gap:30px;
      align-items:center;
      flex-wrap:wrap;
      padding: 0 20px;
      
    }

   .urun{
     max-width:350px;
     height:200px;
     border-radius:9px;
     object-fit:cover;
     transition:2s ease;
   }

   .urun:hover{
    transform:scale(1.1);
   }
    
    .hero-img{
      max-width:600px;
      height:auto;
      object-fit:cover;
      padding:20px 0px;
      border-radius:8px;
      box-shadow: 0 0 15px 10px #EEEEEF;
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
 
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
    }

    #b1{
     overflow:hidden;
     width:100%;
    }

    h3{
     color:#2C3E50;
     font-size:38px;
     padding:15px 15px;
     font-style:italic;
   }

    .nav-item{
      text-decoration:none;
      cursor:pointer;
      font-size:27px;
      color:#F5F5F5;
      font-style:italic;
      padding:5px 15px;
    }

     .nav-item:hover{
       color:#C9A87C;
       text-shadow:0 2px 8px rgba(196,30,58,0.25);
    }

    .container{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:60px;
      align-items:center;
      padding:20px 20px;
      margin-top:0;
    }

    h1{
      color:#4A4A4A;
      text-shadow:5px 5px 5px gray;
      font-size:45px;
      padding:5px 0px;
      font-style:italic;
      animation-name:Slide;
      animation-duration:3s;
 
    }

    .slide-track{
      animation:SLIDE 50s linear infinite;
      display:flex;
      width:max-content;
      justify-content:center;
      gap:20px;
      
    }

   .slide-track:hover{
    animation-play-state:paused;
   }

   .slide-track-container{
    overflow:hidden;
    width:100%;
    padding:20px 0;
   }

   form{
    text-align:center;
    padding:12px 12px;
    border:3px solid black;
    border-radius:9px;
    height:280px;
    width:260px;
   }

   .form-item{
     padding:2px 10px;
     margin-top:8px;
     border-radius:9px;
     cursor:pointer;
     border:none;
   }

   .sub{
     padding:5px;
     border:none;
     border-radius:9px;
     margin-top:10px;
     box-shadow:5px 5px 5px gray;
   }

    @keyframes SLIDE{
      0%{transform:translateX(0);}
      100%{transform:translateX(calc(-50% - 10px));}
    }

   
    @keyframes Slide{
      from{
         opacity:0;
         transform:translateX(50px);
         }
      to{
         opacity:1;
         transform:translateX(0px);
        }
    }

    @media(max-width:768px){
       .navbar{
         padding:10px 0;
         gap:5px;
         flex-direction:column;
       }
       body{
        padding-top:140px;
       }
       h1{
        font-size:30px;
        text-align:center;
       }
       .hero-img{
         max-width:100%;
        padding:0;
         height:auto;
       }
      h3{
       font-size:17px;
      }
     .nav-item{
      padding:2px 8px;
      font-size:13px;
     }
    }
  </style>
 </head>
 <body>
  <nav>
     <div class='navbar'>
        <h3>Optikoz</h3>
        <a href='#' class='nav-item'>Menü</a>
        <a href='#' class='nav-item'>Ürünler</a>
        <a href='#' class='nav-item'>Hakkımızda</a>
        <a href='#' class='nav-item'>İletişim</a>
     </div>
   </nav>
     <header>
       <div class='container'>
         <video autoplay muted playsinline class='hero-img'>
         <source src='3.mp4'>
          </video>
         <h1>Sıradışılığı Bakışlarına Yansıt.</h1>
       </div>
      
     
     </header>
     <section id="b1">
      <div class='slide-track-container'>
       <div class="slide-track">
         <img src="2.jpg" class="urun">
         <img src="3.jpg" class="urun">
         <img src="4.jpg" class="urun">
         <img src="5.jpg" class="urun">
         <img src="2.jpg" class="urun">
         <img src="2.jpg" class="urun">

         <img src="2.jpg" class="urun">
         <img src="2.jpg" class="urun">
         <img src="2.jpg" class="urun">
         <img src="2.jpg" class="urun">
         <img src="2.jpg" class="urun">
         <img src="2.jpg" class="urun">
       </div>
      </div>
     </section>
    <section class='FORM'>
      <div class='container'>
         <form>
            <h4>İLETİŞİM</h4>
            <br>
            <input type='email' placeholder='e-mail:' class='form-item' required >
            <br>
            <input type='password' placeholder='şifre:' class='form-item' required >
            <br>
            <textarea placeholder='Mesaj' class='form-item' required></textarea>
            <br>
            <button type='submit' class='sub'>Gönder</button>
         </form>
      </div>
    </section>
   <script>
      let online = false;
      let username;
      let pass;

      while(!online){
        username = window.prompt('Kullanıcı adı giriniz');
        pass = window.prompt('Şifre giriniz');

        if(username == "admin" && pass == "Ruhi123"){
         online = true;
        }
       else{
          window.alert('giriş yapılamadı, tekrar deneyin');
       }
      }
   </script>
 </body>
</html>
